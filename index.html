
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Universitas Yudharta</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h2 {
            text-align: center;
            margin-top: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
        }

        /* Mobile: 375px */
        @media (max-width: 375px) {
        .grid {
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 15px;
            }
        }

        /* Tablet: 768px */
        @media (min-width: 376px) and (max-width: 768px) {
        .grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            }
        }

        /* Desktop: 1200px */
        @media (min-width: 769px) {
        .grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 30px;
            max-width: 1100px;
            margin: auto;
            }
        }
        .card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 5px #ccc;
        }

        .card h3 {
            color: #2563eb;
        }

        footer {
            background: #172033;
            color: white;
            text-align: center;
            padding: 15px;
        }

    </style>
</head>

<body>

    <header>
        <h1>Universitas Yudharta</h1>
        <p>Informasi Teknologi untuk Pemula</p>
    </header>

    <h2>Artikel Terbaru</h2>

    <div class="grid">

        <div class="card">
            <h3>HTML</h3>
            <p>Belajar membuat struktur halaman website.</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Belajar mengatur warna dan tampilan website.</p>
        </div>

        <div class="card">
            <h3>Python</h3>
            <p>Belajar dasar pemrograman Python.</p>
        </div>

        <div class="card">
            <h3>AI</h3>
            <p>Mengenal kecerdasan buatan dalam kehidupan.</p>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Teknik Informatika</p>
    </footer>

</body>
</html>
